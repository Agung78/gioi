name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gioi_app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gioi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gioi_app -d gioi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gioi_app:password@localhost:5432/gioi_test
      DATABASE_URL_UNPOOLED: postgresql://gioi_app:password@localhost:5432/gioi_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://gioi_app:password@localhost:5432/gioi_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Validate Prisma schema
        working-directory: apps/api
        run: pnpm prisma validate
