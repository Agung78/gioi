name: Backup

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 WITA
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Postgres client tools, age and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age rclone

      - name: Dump, encrypt, and upload to Google Drive
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: 1nxImroHCCbUB60n4WBkeE7sCc7UtIjRL
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set -o pipefail
          # pg_dump -Fc is already compressed; zipping would not shrink it
          pg_dump "$DATABASE_URL_DIRECT" -Fc \
            | age -r "$AGE_PUBLIC_KEY" \
            | rclone rcat "gdrive:gioi-$(date +%F).dump.age"
          # keep 30 days; --drive-use-trash=false frees quota immediately
          rclone delete gdrive: --min-age 30d --drive-use-trash=false --include "gioi-*.dump.age"
